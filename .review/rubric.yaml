# Критерии оценивания ДЗ 2. Формулировки перенесены из README.md дословно.
#
# Файл читается системой авто-ревью: домашка — это репозиторий, критерии живут
# рядом с условием, и их версия фиксируется коммитом.

assignment:
  id: moderation-dz2
  title: "ДЗ 2. Модерация объявлений: сервис на FastAPI"
  course: "Основы backend-разработки"
  track: technical
  max_score: 10
  pass_score: null

  repo_match:
    repository_full_name: "satisf1ed/test_hw_review"

  submission:
    channel: github_pr
    formats: [repo]
    artifact_class: project_tree
    review_sla_days: null
    deadline_at: null
    formal_requirements:
      - id: f1-requirements
        text: "Зависимости перечислите в requirements.txt"
        effect: affects_score
        criterion_id: c4-local-run
        check:
          check_id: file_presence
          params: {patterns: ["requirements.txt"]}
      - id: f2-tests-dir
        text: "Тесты положите в каталог tests/, запуск — pytest"
        effect: affects_score
        criterion_id: c6-tests
    penalty_rule:
      text: "Досдача в течение 1 дня — минус 1 балл; позже работы не принимаются и оцениваются в 0 баллов"
      tiers:
        - {within_hours: 24, outcome: score_delta, score_delta: -1}
        - {within_hours: null, outcome: not_accepted, score_delta: null}

  ai_policy:
    text: "Использование ИИ-инструментов допускается, но необоснованное использование считается нарушением. Если вы применяли ИИ, укажите это в описании пул-реквеста и опишите, как именно."
    declaration_required: true
    unjustified_use_consequence: "балл снижается"

  context:
    handler: moderate
    input_schema:
      - {name: ad_id, type: int}
      - {name: seller_id, type: int}
      - {name: is_trusted_seller, type: bool}
      - {name: title, type: str}
      - {name: text, type: str}
      - {name: price, type: int}
      - {name: photos_count, type: int}

  criteria:
    - id: c1-handler
      title: "Корректный обработчик: соответствие заданному API"
      max_score: 2
      min_score: null
      checkable: deterministic
      check:
        check_id: openapi_conformance
        params:
          path: /moderate
          method: post
      levels:
        - {score: 0, descriptor: "обработчик не соответствует заданному API"}
        - {score: 1, descriptor: "обработчик соответствует заданному API"}
        - {score: 2, descriptor: "обработчик соответствует заданному API и возвращает заданную структуру ответа"}

    - id: c2-moderation-logic
      title: "Правильная логика модерации по описанным правилам"
      max_score: 2
      min_score: null
      checkable: deterministic
      check:
        check_id: business_rule_probe
        params:
          path: /moderate
      levels:
        - {score: 0, descriptor: "логика не соответствует описанной в задании"}
        - {score: 1, descriptor: "логика частично соответствует описанной"}
        - {score: 2, descriptor: "логика полностью соответствует описанной в задании"}

    - id: c3-status-codes
      title: "Предсказуемые статусы (200 при успехе, 400 или 422 при ошибке валидации)"
      max_score: 1
      min_score: null
      checkable: deterministic
      check:
        check_id: status_codes
        params:
          path: /moderate
          success: 200
      levels:
        - {score: 0, descriptor: "при ошибках возвращается 500 или пустой ответ"}
        - {score: 1, descriptor: "сервис возвращает 200 при успехе и клиентскую ошибку при невалидных данных"}

    - id: c4-local-run
      title: "Локальный запуск без ошибок через fastapi dev"
      max_score: 1
      min_score: null
      checkable: deterministic
      check:
        check_id: app_start
        params:
          command: "fastapi dev"
          readiness: /openapi.json
      levels:
        - {score: 0, descriptor: "проект не запускается или требует ручных доработок"}
        - {score: 1, descriptor: "проект разворачивается и запускается локально без ошибок через fastapi dev"}

    - id: c5-clean-architecture
      title: "Соответствие принципам чистой архитектуры: разделение роутов и бизнес-логики"
      max_score: 1
      min_score: null
      checkable: llm
      levels:
        - {score: 0, descriptor: "код монолитный, бизнес-логика смешана с роутами"}
        - {score: 1, descriptor: "выделены уровни роутов и бизнес-логики"}
      evidence_required:
        - {kind: text, spec: "структура проекта: где лежат роуты и где бизнес-логика"}

    - id: c6-tests
      title: "Тесты: наличие, покрытие позитивных, негативных сценариев и corner-cases"
      max_score: 3
      min_score: null
      checkable: llm
      levels:
        - {score: 0, descriptor: "тесты отсутствуют"}
        - {score: 1, descriptor: "есть тесты на позитивные и негативные сценарии, но нет обработки corner-cases"}
        - {score: 2, descriptor: "тесты покрывают все возможные corner-cases"}
        - {score: 3, descriptor: "в тестах используется параметризация для проверки corner-cases чтобы уменьшить дублирование кода"}
      evidence_required:
        - {kind: text, spec: "какие сценарии покрыты тестами"}

  checklist: []
  definition_of_done: []
  golden_set: []
